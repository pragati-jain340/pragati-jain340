name: Metrics
on:
  # Schedule daily updates (every 24 hours at midnight)
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing to main
  push: {branches: ["main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # This MUST match the name of the secret in your repository (METRICS_TOKEN)
          token: ${{ secrets.METRICS_TOKEN }}
          
          # General configuration
          template: classic
          config_timezone: Asia/Kolkata
          
          # Plugin: ISO Calendar (This is the labeled contribution graph)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # Output branch configuration
          filename: github-metrics.svg
          committer_branch: metrics
          committer_message: "chore: update metrics [skip ci]"
